name: Monitor de precios Samsung

permissions:
  contents: write

on:
  schedule:
    # Chile continental esta en UTC-4 (verano) / UTC-3 (invierno) -- estos
    # horarios en UTC estan calculados para invierno (UTC-3, vigente en julio).
    # Van a correr 1 hora antes/despues de lo pedido durante el horario de
    # verano hasta que se reajuste (pedido operador 2026-07-21: 01, 04, 10,
    # 13, 16, 19, 22 hora Chile -- todas separadas por >=3h para no toparse
    # con corridas de ~130-170 min).
    - cron: "0 4 * * *"  # 01:00 Chile
    - cron: "0 7 * * *"  # 04:00 Chile
    - cron: "0 13 * * *" # 10:00 Chile
    - cron: "0 16 * * *" # 13:00 Chile
    - cron: "0 19 * * *" # 16:00 Chile
    - cron: "0 22 * * *" # 19:00 Chile
    - cron: "0 1 * * *"  # 22:00 Chile
  workflow_dispatch: {}

# La concurrencia va a nivel de WORKFLOW, no de job: a nivel de job no impidio
# que dos corridas se solaparan (medido: la corrida del 01-08 09:40 arranco 43 s
# despues del commit de la anterior, o sea su checkout era mas viejo que ese
# push). Dos corridas solapadas comparan contra un catalogo viejo y reenvian
# avisos ya mandados.
concurrency:
  group: monitor-samsung
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Pruebas automatizadas (bloquean la corrida si fallan)
        run: npm test

      - run: npx playwright install --with-deps chromium

      # El checkout puede ser mas viejo que el ultimo push de datos (el job queda
      # encolado, o corre justo detras de otra corrida). Comparar contra un
      # catalogo viejo hace que el monitor reenvie avisos ya mandados y que
      # productos ya conocidos se anuncien como "nuevo".
      - name: Traer el ultimo catalogo antes de comparar
        run: git pull --ff-only origin main

      - name: Revisar precios
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run run

      - name: Guardar historial y ultimo estado
        run: |
          git config user.name "monitor-samsung-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "sin cambios que commitear" && exit 0
          git commit -m "chore: actualiza datos $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Antes esto usaba "-X theirs", que en archivos append-only
          # (history.jsonl, ejecuciones.jsonl) resolvia el conflicto BORRANDO las
          # lineas de la otra corrida: medido en el historial de git, hubo
          # commits donde el archivo perdio lineas. Ahora los .jsonl se fusionan
          # por union (ver .gitattributes) y el resto se rebasa normal.
          git pull --rebase origin main
          git push
